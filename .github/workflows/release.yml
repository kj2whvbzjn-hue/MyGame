name: Unity RELEASE - GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: RELEASE - Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true


      # Keep downloaded Unity packages cached without restoring the whole Library.
      - name: Restore Unity PackageCache
        id: unity-package-cache
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: unity-packagecache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-packagecache-${{ runner.os }}-

      # Preserve Unity's WebGL incremental-build state, not only final Bee artifacts.
      # Unity 6 uses Library/Bee plus BuildPlayerData/PlayerDataCache metadata to decide
      # whether Player build content can actually be reused.
      # We still avoid caching the entire Library because that previously caused exit 137.
      - name: Restore WebGL incremental build cache
        id: unity-webgl-build-cache
        uses: actions/cache@v4
        with:
          path: |
            Library/Bee
            Library/BuildPlayerData
            Library/PlayerDataCache
            Library/BurstCache/Wasm-Wasm
          key: unity-webgl-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-webgl-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.BuildWebGL

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL/WebGL

  deploy:
    name: RELEASE - Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  playwright:
    name: RELEASE - Playwright Public Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Check deployed Unity WebGL
        env:
          WEBGL_URL: ${{ needs.deploy.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-webgl.mjs

      - name: Upload Playwright screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-webgl-screenshot
          path: playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 14
