name: Unity FAST Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: read

jobs:
  fast:
    name: FAST - Unity Compile and Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Cache only downloaded Unity packages.
      # Whole-Library restore caused FAST exit code 137 on this project.
      - name: Restore Unity PackageCache
        id: unity-package-cache
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: unity-packagecache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-packagecache-${{ runner.os }}-

      # FAST incremental state proven useful by measurements.
      # BurstCache/JIT is intentionally excluded: warm-run testing showed no benefit.
      - name: Restore FAST incremental cache
        id: unity-fast-incremental-cache
        uses: actions/cache@v4
        with:
          path: |
            Library/Bee
            Library/ScriptAssemblies
            Library/ArtifactDB
            Library/DataStore
          key: unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: FAST diagnostics before Unity
        shell: bash
        run: |
          echo '=== FAST PERFORMANCE DIAGNOSTICS: BEFORE UNITY ==='
          echo "PackageCache cache-hit: ${{ steps.unity-package-cache.outputs.cache-hit }}"
          echo "FAST incremental cache-hit: ${{ steps.unity-fast-incremental-cache.outputs.cache-hit }}"
          echo 'Disk:'
          df -h . || true
          echo 'Library directories before Unity:'
          for d in Library/PackageCache Library/Bee Library/ScriptAssemblies Library/SourceAssetDB Library/ArtifactDB Library/DataStore; do
            if [ -e "$d" ]; then du -sh "$d" || true; else echo "MISSING $d"; fi
          done
          echo '================================================='

      - name: Run Unity FAST validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.ValidateOnly

      - name: FAST diagnostics after Unity
        if: always()
        shell: bash
        run: |
          echo '=== FAST PERFORMANCE DIAGNOSTICS: AFTER UNITY ==='
          echo 'Library directory sizes:'
          for d in Library/PackageCache Library/Bee Library/ScriptAssemblies Library/SourceAssetDB Library/ArtifactDB Library/DataStore; do
            if [ -e "$d" ]; then du -sh "$d" || true; else echo "MISSING $d"; fi
          done
          echo
          echo 'Largest Library subdirectories:'
          if [ -d Library ]; then
            du -h -d 2 Library 2>/dev/null | sort -h | tail -30 || true
          else
            echo 'MISSING Library'
          fi
          echo
          echo 'Unity/Bee timing and rebuild clues found in logs:'
          LOGS=""
          for f in             "$GITHUB_WORKSPACE/Library/Bee/bee_backend.info"             "$GITHUB_WORKSPACE/Library/Bee/bee_backend.log"             "$GITHUB_WORKSPACE/Library/LastSceneManagerSetup.txt"             "$GITHUB_WORKSPACE/Editor.log"             "$HOME/.config/unity3d/Editor.log"; do
            [ -f "$f" ] && LOGS="$LOGS $f"
          done
          if [ -n "$LOGS" ]; then
            grep -Eai 'Import|Refresh|compile|compil|Bee|Tundra|IL2CPP|AutomationEntry|ValidateOnly|domain reload|reload assemblies|script assembl|cache hit|cache miss|requires additional run|seconds|ms' $LOGS 2>/dev/null | tail -250 || true
          else
            echo 'No readable Unity timing log file found outside the unity-builder step.'
          fi
          echo '================================================'
